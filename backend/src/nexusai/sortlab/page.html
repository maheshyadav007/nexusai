<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort lab</title>
<style>
:root {
  --page: #F3EEE5; --raised: #FFFDF9; --sunken: #E8E0D3; --ink: #191714; --ink-2: #3E372F;
  --muted: #5F564C; --line: #D9D1C3; --line-strong: #8F7D6C; --accent: #A8441F; --on-accent: #FCF3EE;
  --good: #3B5C33; --bad: #A83226;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --page: #121010; --raised: #201C18; --sunken: #0C0B0A; --ink: #EFE9DE; --ink-2: #DACBBF;
  --muted: #B5A99B; --line: #3A3128; --line-strong: #6E5A4C; --accent: #E0784F; --on-accent: #191714;
  --good: #8FBF80; --bad: #EB8074; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--sans); }
main { max-width: 900px; margin: 0 auto; padding: 32px 16px 110px; display: flex; flex-direction: column; gap: 28px; }
h1 { font-size: 24px; margin: 0; }
h2 { font-size: 16px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 420px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=password] { font: 14px var(--sans); color: var(--ink); background: var(--raised);
  border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px; min-width: 0; }
button { font: 600 13px var(--sans); border-radius: 8px; padding: 9px 14px; cursor: pointer; min-height: 38px;
  border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.link { border: 0; background: none; color: var(--accent); padding: 2px 0; min-height: 0; font-weight: 500; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { height: 8px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.heading { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line-strong); padding-bottom: 6px; }
.list { display: flex; flex-direction: column; }
.item { border-bottom: 1px solid var(--line); padding: 8px 0; display: flex; flex-direction: column; gap: 6px; }
.line { display: grid; grid-template-columns: minmax(140px, 220px) 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.line input[type=text] { width: 100%; font-weight: 600; }
.count { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.example { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); min-width: 0; }
.example button { margin-left: 6px; }
.switch { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; cursor: pointer; min-height: 36px; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.emails { padding: 4px 0 4px 12px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.emails div { display: flex; gap: 12px; min-width: 0; }
.emails .subject { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.emails .sender { color: var(--muted); flex: 0 1 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--raised); border-top: 1px solid var(--line); padding: 12px 16px; }
.footer .inner { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.error { color: var(--bad); }
.good { color: var(--good); }
@media (max-width: 640px) {
  .line { grid-template-columns: 1fr auto; }
  .line .example { grid-column: 1 / -1; }
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="signin" class="card" hidden>
    <h1>Sort lab</h1>
    <p class="muted">See how NexusAI would sort your mail. It runs only on this computer and never changes anything on the mail server.</p>
    <p id="not-set" class="error" hidden></p>
    <form id="form" style="display: flex; flex-direction: column; gap: 12px">
      <label class="field">Username <input id="username" type="text" required autocomplete="username" autocapitalize="off" spellcheck="false"></label>
      <label class="field">Password <input id="password" type="password" required autocomplete="current-password"></label>
      <div><button class="primary" type="submit" id="go">Connect</button></div>
    </form>
    <div id="progress" hidden>
      <p id="progress-text">Connecting…</p>
      <div class="bar" style="margin-top: 8px"><div id="progress-bar"></div></div>
    </div>
    <p id="signin-error" class="error" hidden></p>
  </section>

  <section id="results" hidden style="display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1>Your mail, sorted</h1>
      <p class="muted" id="summary"></p>
    </div>
    <datalist id="names"></datalist>
    <div id="lists" style="display: flex; flex-direction: column; gap: 28px"></div>
  </section>

  <section id="done" class="card" hidden>
    <h1>Done</h1>
    <p class="good" id="done-text"></p>
    <p class="muted">The folder with the file has opened. Send the file to the NexusAI team. You can close this tab and the lab's window.</p>
    <div><button type="button" id="again">Start again</button></div>
  </section>
</main>

<div class="footer" id="footer" hidden>
  <div class="inner">
    <label class="row" style="gap: 8px"><input type="checkbox" id="details" checked> Include senders and subjects, so the sorting can be improved</label>
    <div class="row">
      <span id="confirm-text" class="muted" hidden></span>
      <button type="button" id="discard">Discard</button>
      <button type="button" class="primary" id="finish">Finish</button>
    </div>
  </div>
</div>

<script>
"use strict";
const token = location.hash.slice(1);
// The engine's sections, in the order and words the page shows them.
const HEADINGS = [
  ["automated", "Automated"],
  ["calendar", "Calendar"],
  ["people", "Announcements"],
  ["too_few", "Small senders"],
];
const SMALL = 5;
const categories = {};
const added = {};
let report = null;
let confirming = null;

function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value === true) node.setAttribute(key, "");
    else if (value !== false && value != null) node.setAttribute(key, String(value));
  }
  for (const child of children.flat()) if (child != null) node.append(child instanceof Node ? child : String(child));
  return node;
}

async function api(path, body) {
  const response = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Lab-Token": token, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!response.ok) throw new Error((await response.json().catch(() => ({}))).detail || response.statusText);
  return response.json();
}

function show(id) {
  for (const name of ["signin", "results", "done"]) document.getElementById(name).hidden = name !== id;
  document.getElementById("footer").hidden = id !== "results";
}

const fmt = (n) => Number(n).toLocaleString();

async function boot() {
  if (!token) { document.body.textContent = "Open the link the Sort lab showed in its window."; return; }
  const status = await api("/api/status");
  if (status.state === "ready") return loadResults();
  show("signin");
  const setup = await api("/api/setup");
  if (setup.domain) document.getElementById("username").placeholder = `name or name@${setup.domain}`;
  if (!setup.ready) {
    const notSet = document.getElementById("not-set");
    notSet.textContent = `This copy of the Sort lab doesn't know your mail server. Put the sortlab.env file you were given in the same folder as the lab (${setup.settings_file}), then start it again.`;
    notSet.hidden = false;
    document.getElementById("go").disabled = true;
  }
  if (["connecting", "downloading", "grouping"].includes(status.state)) watch();
}

document.getElementById("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const error = document.getElementById("signin-error");
  error.hidden = true;
  try {
    await api("/api/start", { username: document.getElementById("username").value.trim(), password: document.getElementById("password").value });
    document.getElementById("password").value = "";
    watch();
  } catch (problem) { error.textContent = problem.message; error.hidden = false; }
});

async function watch() {
  document.getElementById("go").disabled = true;
  document.getElementById("progress").hidden = false;
  const text = document.getElementById("progress-text");
  const bar = document.getElementById("progress-bar");
  for (;;) {
    const status = await api("/api/status");
    if (status.state === "connecting") text.textContent = "Connecting…";
    if (status.state === "downloading") text.textContent = `Reading ${fmt(status.done)} of ${fmt(status.total)} emails…`;
    if (status.state === "grouping") text.textContent = "Sorting…";
    bar.style.width = status.total ? `${Math.round((status.done / status.total) * 100)}%` : "4%";
    if (status.state === "ready") return loadResults();
    if (status.state === "failed") {
      const error = document.getElementById("signin-error");
      error.textContent = status.error; error.hidden = false;
      document.getElementById("go").disabled = false;
      document.getElementById("progress").hidden = true;
      return;
    }
    await new Promise((resolve) => setTimeout(resolve, 800));
  }
}

function summarize() {
  const away = Object.values(categories).filter((c) => !c.smart).reduce((n, c) => n + c.count, 0)
    + Object.values(added).filter((a) => !a.smart).reduce((n, a) => n + a.count, 0);
  document.getElementById("summary").textContent =
    `${fmt(report.total)} emails. ${fmt(away)} kept away from the AI, ${fmt(report.total - away)} read by it.`;
  const names = new Set([...Object.values(categories), ...Object.values(added)].map((c) => c.name.trim()).filter(Boolean));
  document.getElementById("names").replaceChildren(...[...names].sort().map((name) => h("option", { value: name })));
}

async function loadResults() {
  report = await api("/api/report");
  show("results");
  for (const group of report.groups) {
    categories[group.id] ??= { id: group.id, name: group.label || group.reasons[0] || "", smart: group.smart, count: group.count };
  }
  for (const miss of report.missed) added[miss.sender] ??= { sender: miss.sender, name: "", smart: true, count: miss.count };
  const lists = document.getElementById("lists");
  lists.replaceChildren();
  for (const [section, title] of HEADINGS) {
    const groups = report.groups.filter((g) => g.section === section);
    if (groups.length) lists.append(block(title, groups.map((g) => [g, categories[g.id]])));
  }
  if (report.missed.length) {
    lists.append(block("Not in a category", report.missed.map((m) => [m, added[m.sender]]),
      `The biggest senders left out. Give one a category, or switch the AI off, if it's noise.`));
  }
  summarize();
}

function block(title, items, note) {
  const total = items.reduce((n, [, state]) => n + state.count, 0);
  const list = h("div", { class: "list" });
  const big = items.filter(([, state]) => state.count >= SMALL);
  const small = items.filter(([, state]) => state.count < SMALL);
  list.append(...(big.length ? big : small).map(([item, state]) => row(item, state)));
  if (big.length && small.length) {
    const fold = h("div", { hidden: true }, small.map(([item, state]) => row(item, state)));
    list.append(h("button", { type: "button", class: "link", style: "align-self: flex-start; margin-top: 8px",
      onclick: (e) => { fold.hidden = !fold.hidden; e.target.textContent = fold.hidden ? `Show ${fmt(small.length)} smaller ones` : "Hide smaller ones"; } },
      `Show ${fmt(small.length)} smaller ones`), fold);
  }
  return h("div", { style: "display: flex; flex-direction: column; gap: 6px" },
    h("div", { class: "heading" }, h("h2", {}, title), h("span", { class: "muted" }, `${fmt(total)} emails`)),
    note ? h("p", { class: "muted" }, note) : null, list);
}

function row(item, state) {
  const emails = h("div", { class: "emails", hidden: true }, item.emails.map((email) =>
    h("div", {}, h("span", { class: "subject" }, email.subject || "(no subject)"), h("span", { class: "sender" }, email.sender))));
  const example = item.emails[0]?.subject || "(no subject)";
  return h("div", { class: "item" },
    h("div", { class: "line" },
      h("input", { type: "text", list: "names", value: state.name, placeholder: "Category", "aria-label": "Category",
        oninput: (e) => { state.name = e.target.value; }, onchange: summarize }),
      h("span", { class: "count" }, fmt(state.count)),
      h("span", { class: "example", title: example }, example,
        h("button", { type: "button", class: "link", onclick: (e) => { emails.hidden = !emails.hidden; e.target.textContent = emails.hidden ? "Show" : "Hide"; } }, "Show")),
      h("label", { class: "switch" }, h("input", { type: "checkbox", checked: state.smart, onchange: (e) => { state.smart = e.target.checked; summarize(); } }), "AI reads it")),
    emails);
}

const LABELS = { finish: "Finish", discard: "Discard" };
function ask(button, text, action) {
  // The first click says what will happen; only a second click on the same button does it.
  const label = document.getElementById("confirm-text");
  if (confirming !== button.id) {
    confirming = button.id;
    for (const [id, words] of Object.entries(LABELS)) document.getElementById(id).textContent = words;
    label.textContent = text; label.hidden = false;
    button.textContent = "Yes, " + LABELS[button.id].toLowerCase();
    return;
  }
  confirming = null;
  label.hidden = true;
  action().catch((problem) => { label.textContent = problem.message; label.hidden = false; });
}

document.getElementById("finish").addEventListener("click", (event) => ask(event.target,
  `Saves the categories and deletes the ${fmt(report.total)} downloaded emails from this computer.`, async () => {
    const result = await api("/api/finish", {
      groups: Object.values(categories).map(({ id, name, smart }) => ({ id, name, smart })),
      misses: Object.values(added).map(({ sender, name, smart }) => ({ sender, name, smart })),
      details: document.getElementById("details").checked,
    });
    document.getElementById("done-text").textContent = `Saved to ${result.saved}. Deleted ${fmt(result.deleted)} downloaded emails from this computer.`;
    show("done");
  }));

document.getElementById("discard").addEventListener("click", (event) => ask(event.target,
  `Deletes the ${fmt(report.total)} downloaded emails and saves nothing.`, async () => {
    const result = await api("/api/discard", {});
    document.getElementById("done-text").textContent = `Deleted ${fmt(result.deleted)} downloaded emails. Nothing was saved.`;
    show("done");
  }));

document.getElementById("again").addEventListener("click", () => location.reload());

boot().catch((problem) => { document.body.textContent = problem.message; });
</script>
</body>
</html>
