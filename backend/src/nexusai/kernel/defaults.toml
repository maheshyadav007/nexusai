# Every tunable value lives here. Environment variables named NEXUSAI_<KEY> override these.
[server]
host = "127.0.0.1"
port = 4100
allowed_hosts = ["127.0.0.1:4100", "localhost:4100", "[::1]:4100", "127.0.0.1:4000", "localhost:4000", "[::1]:4000"]
allowed_origins = ["http://127.0.0.1:4000", "http://localhost:4000", "http://[::1]:4000"]

[home]
min_free_bytes = 5368709120
max_upload_bytes = 209715200

backups_kept = 3
backup_interval_hours = 24

[events]
max_chain_depth = 20
handler_max_attempts = 3
handler_retry_delay_seconds = 0.2
sse_keepalive_seconds = 15
log_page_size = 200

[chatgpt]
issuer = "https://auth.openai.com"
base_url = "https://chatgpt.com/backend-api/codex"
# Codex's public sign-in client. OpenAI hasn't issued one for NexusAI.
client_id = "app_EMoamEEZ73f0CkXaXp7hrann"
originator = "nexusai"
timeout_seconds = 60
login_timeout_seconds = 900
min_poll_seconds = 3
refresh_skew_seconds = 120
# The list hides newer models from older client versions; 0.0.0 is the fallback.
model_list_client_versions = ["99.0.0", "0.0.0"]
test_instructions = "You are NexusAI's connection test. Reply briefly."

[mail]
# Filed by rule on every Home, without a model. One with no mail stays out of the sidebar.
starter_categories = [
  { name = "PLM", subject_prefix = "[PLM]" },
  { name = "Swarm", subject_prefix = "[Swarm]" },
  { name = "3GPP Briefing", subject_prefix = "[3GPP Briefing]" },
]
connect_timeout_seconds = 30
initial_batch = 200
backfill_batch = 100
# How many emails come down between progress updates.
progress_every = 10
flag_window = 500
# How many emails the connect form suggests downloading. New mail always comes down.
suggested_pull = 5000
# The longest between checks for new mail. Servers that support IDLE announce it sooner.
# Mail landing between the last fetch and IDLE starting may not be announced, so this is also
# how long it could take to appear. Servers drop IDLE after about 30 minutes, so stay below that.
check_every_seconds = 60
reconnect_min_seconds = 2
reconnect_max_seconds = 300
signature_max_bytes = 30000
signature_repeat_count = 3

# Known servers, matched on the part of the username after the @. Add the company's server here,
# so people there only need a username and password. A preset with domain = "*" applies to a
# username with no @ in it.
[[mail.presets]]
domain = "gmail.com"
label = "Gmail"
imap_host = "imap.gmail.com"
imap_port = 993
smtp_host = "smtp.gmail.com"
smtp_port = 465
secure = true
password_hint = "Use a Google App Password, not your normal password."

# Used when NEXUSAI_MAIL_HOST sets the company's server. See .env.example.
[system_mail]
label = "Company mail"
protocol = "pop3"
port = 995
secure = true
verify_cert = true
smtp_port = 25
smtp_secure = false

# Used when NEXUSAI_MODEL_URL sets the company's model server.
[system_model]
# Off works on any server, since tool calls then go through the reply text.
supports_tools = false
# Sent when the server wants no key, since requests need something in that header.
no_key = "none"

[agent]
# 0 means no limit.
daily_token_cap = 0
max_running_sessions = 3
triage_batch = 10
# A larger arrival uses grouped learning, rather than one model call per message.
bulk_mail_threshold = 50
triage_retry_seconds = 60
# Model calls allowed in a minute, across every agent. 0 means no limit of our own.
model_calls_per_minute = 0
# When the server says to slow down: tries again this many times, waiting longer each time, unless
# the server says how long. A wait over the longest goes back in line instead of holding the call.
rate_limit_retries = 3
rate_limit_wait_seconds = 10
rate_limit_longest_wait = 60
max_recent_thread_messages = 8
max_thread_chars = 20000
memory_max_chars = 8000
# One run of the Mail agent. It stops there, and what it finished is kept.
triage_token_limit = 30000
# A suggested category shows once this many conversations would go in it.
category_suggestion_min_threads = 5
# Compatibility setting: 0 disables grouped bulk learning; any positive value enables it.
# Groups are learned in batches of 30. Known groups require no further learning call.
learn_emails = 400
# Legacy individual-learning window; grouped learning uses a fixed 7-day recent review.
learn_recent_days = 7
command_timeout_seconds = 120
max_tool_output_chars = 20000
max_agent_messages_per_run = 20
max_steps = 40

# Typed messages. The chat shows everything, and this is only what the model is sent.
[context.chat]
# "trim" or "auto_compact".
mode = "trim"
keep_messages = 40
trim_saved_history = false

# Events and schedules. Those chats grow forever, so what's saved is shortened too.
[context.triggered]
mode = "trim"
keep_messages = 12
trim_saved_history = true

# Used by auto_compact and by Compact now.
[context.compact]
trigger_tokens = 15000
keep_messages = 12
summarize_up_to_tokens = 4000

# Whatever the mode, so one run with large results can't overflow the model.
[context.tool_results]
clear_after_tokens = 100000
keep_recent = 3

[logs]
retention_days = 30

[network]
check_timeout_seconds = 8

[settings]
theme = "nexus-light"
density = "comfortable"
text_size = "medium"
accent = "terracotta"
default_screen = "today"
date_format = "system"
time_format = "system"
# Whether mail's outside images load by themselves. They can tell a sender it was opened, and from
# what address, so a company may prefer "block". Trackers are removed either way.
remote_images = "load"
sound_muted = false
sound_off = []

[semantic]
# Where models come from, unless the person sets a mirror.
hub = "https://huggingface.co"
