[project]
name = "nexusai"
version = "0.1.0"
description = "NexusAI local backend"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "imapclient>=3",
    "keyring>=25",
    "langchain>=1.4",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2",
    "libpff-python>=20240101",
    "mcp>=2.3",
    "nh3>=0.2",
    "numpy>=1.26",
    "olefile>=0.47",
    "onnxruntime>=1.20",
    "openpyxl>=3.1",
    "psutil>=6",
    "pydantic>=2.14.2",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-pptx>=1",
    "sqlcipher3-wheels>=0.5.7",
    "striprtf>=0.0.35",
    "structlog>=26.1.0",
    "tokenizers>=0.20",
    "uvicorn[standard]>=0.54.0",
    "watchdog>=7",
    "xlrd>=2.0.2",
]

[project.scripts]
nexusai-backend = "nexusai.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not speed'"
markers = ["speed: the 100,000-message speed targets; slow to set up, run with make speed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are SQL and test data, which read better whole.
"src/nexusai/modules/mail/store.py" = ["E501"]
"src/nexusai/modules/mail/pst.py" = ["E501"]
"src/nexusai/modules/mail/module.py" = ["E501"]
"src/nexusai/modules/documents/module.py" = ["E501"]
"src/nexusai/modules/panels/module.py" = ["E501"]
"src/nexusai/modules/agent/*" = ["E501"]
"src/nexusai/modules/planner/*" = ["E501"]
"src/nexusai/modules/models/module.py" = ["E501"]
"src/nexusai/modules/semantic/module.py" = ["E501"]
"src/nexusai/modules/semantic/index.py" = ["E501"]
"tests/test_documents_home.py" = ["E501"]
"src/nexusai/modules/connectors/module.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["imapclient.*", "pypff.*", "docx.*", "pptx.*", "openpyxl.*", "onnxruntime.*", "olefile.*", "xlrd.*", "striprtf.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "nexusai"

[[tool.importlinter.contracts]]
name = "Layers run one way"
type = "layers"
layers = ["nexusai.api", "nexusai.modules", "nexusai.kernel", "nexusai.contracts"]

[[tool.importlinter.contracts]]
name = "Kernel and contracts contain no product logic"
type = "forbidden"
source_modules = ["nexusai.contracts", "nexusai.kernel"]
forbidden_modules = ["nexusai.modules", "nexusai.api"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "types-psutil>=7.2.2.20260906",
    "xlwt>=1.3",
]
