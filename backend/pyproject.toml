[project]
name = "nexusai"
version = "0.1.0"
description = "NexusAI local backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "keyring>=25",
    "psutil>=6",
    "pydantic>=2.14.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nexusai-backend = "nexusai.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "nexusai"

[[tool.importlinter.contracts]]
name = "Layers run one way"
type = "layers"
layers = ["nexusai.api", "nexusai.modules", "nexusai.kernel", "nexusai.contracts"]

[[tool.importlinter.contracts]]
name = "Kernel and contracts contain no product logic"
type = "forbidden"
source_modules = ["nexusai.contracts", "nexusai.kernel"]
forbidden_modules = ["nexusai.modules", "nexusai.api"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "types-psutil>=7.2.2.20260906",
]
