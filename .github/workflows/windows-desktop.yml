name: Windows desktop validation

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-ci/**'
      - 'desktop-beta/**'

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-install-update:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use a non-UTC Windows timezone
        shell: powershell
        run: |
          Set-TimeZone -Id 'India Standard Time'
          Remove-Item Env:TZ -ErrorAction SilentlyContinue
          'NEXUSAI_TEST_WINDOWS_ZONE=Asia/Kolkata' >> $env:GITHUB_ENV
      - name: Download the published single-folder Beta to test its conversion
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.1.0 is the last Beta installed as a single folder; later Betas install versions side by side.
          $tag = gh release list --repo $env:GITHUB_REPOSITORY --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("desktop-beta/0.1.0/"))][0].tagName'
          if (-not $tag) { throw 'No published single-folder Beta 0.1.0 release to convert.' }
          $folder = Join-Path $env:RUNNER_TEMP 'legacy-beta'
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern '*.exe' --dir $folder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = @(Get-ChildItem $folder -Filter '*.exe')
          if ($installer.Count -ne 1) { throw "Expected one installer in $tag." }
          "NEXUSAI_LEGACY_INSTALLER=$($installer[0].FullName)" >> $env:GITHUB_ENV
      - name: Build and verify automatic and manual Beta upgrades
        shell: powershell
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/desktop-beta/*') { $betaVersion = ($env:GITHUB_REF_NAME -split '/')[1]; .\desktop.cmd beta -Version $betaVersion } else { .\desktop.cmd ci }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect installer diagnostics
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force .release/installer-logs | Out-Null
          Get-ChildItem "$env:TEMP/nexusai-*.log" -ErrorAction SilentlyContinue | Copy-Item -Destination .release/installer-logs
          Get-ChildItem "$env:LOCALAPPDATA/NexusAI-Pipeline-*/logs/*.log" -ErrorAction SilentlyContinue | Copy-Item -Destination .release/installer-logs
      - name: Upload test evidence and generic installer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop-validation
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .release/artifacts/unsigned/*/*.exe
            .release/artifacts/unsigned/*/release.json
            .release/artifacts/unsigned/*/smoke.json
            .release/artifacts/ci/0.1.2/*.exe
            .release/artifacts/ci/*/release.json
            .release/artifacts/ci/*/smoke.json
            .release/artifacts/acceptance/*/release.json
            .release/artifacts/acceptance/*/smoke.json
            .release/acceptance.json
            .release/installer-logs/*.log
            .release/ci/**/plan.json
            .release/ci/**/result.json
            .release/ci/**/before.png
            .release/ci/**/after.png
            .release/ci/**/app-data/desktop.log
            .release/smoke/**/result.json
            .release/smoke/**/window.png
            .release/smoke/**/desktop.log

  publish-beta:
    if: startsWith(github.ref, 'refs/tags/desktop-beta/')
    needs: build-install-update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-desktop-validation
          path: evidence
      - name: Publish tested Beta installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          version = os.environ['GITHUB_REF_NAME'].split('/')[1]
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          root = Path('evidence/artifacts/unsigned') / version
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('BETA_VERSION=' + version + '\n')
          manifest = json.loads((root / 'release.json').read_text())
          assert not manifest.get('ciProbe')
          assert not manifest.get('acceptanceProbe')
          assert manifest['version'] == version
          acceptance = json.loads(Path('evidence/acceptance.json').read_text())
          assert acceptance['sourceCommit'] == manifest['sourceCommit'] == os.environ['GITHUB_SHA']
          assert acceptance['appId'] == manifest['appId'] == 'com.nexusai.pilot'
          assert acceptance['downgradeBlocked'] and acceptance['orphanServiceBlocked'] and acceptance['lockedOldFileUpdate'] and acceptance['launcherRecovery']
          assert acceptance['uninstallKeepsData'] and acceptance['uninstallDeletesOnlyNexusData'] and acceptance['legacyConverted']
          assert acceptance['automatic']['oldVersion'] == 'kept' and acceptance['manual']['oldVersion'] == 'removed'
          for mode in ('automatic', 'manual'):
              assert all(acceptance[mode][key] for key in ('ok', 'settingsPreserved', 'browserStoragePreserved', 'appDataPreserved', 'homeReady'))
          smoke = json.loads((root / 'smoke.json').read_text())
          assert smoke['ok'] and smoke['version'] == manifest['version']
          assert smoke['releaseSha256'] == hashlib.sha256((root / 'release.json').read_bytes()).hexdigest()
          for item in manifest['files']:
              if item['name'].endswith('.exe'):
                  file = root / item['name']
                  digest = hashlib.sha256(file.read_bytes()).hexdigest()
                  assert digest == item['sha256']
                  (root / 'SHA256SUMS.txt').write_text(digest + '  ' + file.name + '\n')
          PY
          cat > notes.md <<'EOF'
          NexusAI Beta for Windows x64. This unsigned test release is intended for operator acceptance testing before a small-group rollout.

          Includes guided deterministic Posty onboarding (outline robot placeholder), password visibility, clearer mail-download guidance, simplified chat waiting states, attachment discovery for agents, OS certificate trust for search-model downloads, desktop app/update controls and a single Windows header with native window buttons.

          Windows updates now install each version beside the previous one and switch to it on restart, so files held by security scanning no longer block an update. You can still choose the installation folder; updates stay in it. Uninstall keeps your data unless you tick "Also delete my NexusAI data".

          Automated gates: non-UTC backend checks, installed automatic and manual Beta upgrades preserving test data, an update while an old file is held open, launcher recovery, downgrade rejection, orphan-service blocking, uninstall with and without data removal, conversion of the previous single-folder Beta, and a separate distributable Beta startup/shutdown smoke test.

          This generic Beta installer contains no internal credentials and no configured update server. About & Updates explains that updates are manual until an internal feed is configured. Acceptance uses the real Beta identity in a guarded disposable runner, synthetic data and a temporary local feed; acceptance installers are not distributed. Windows notification policies, internal model/download access and real-mail behavior still need target-device testing.
          EOF
          beta_version="${GITHUB_REF_NAME#desktop-beta/}"
          beta_version="${beta_version%%/*}"
          gh release create "$GITHUB_REF_NAME" evidence/artifacts/unsigned/"$beta_version"/*.exe evidence/artifacts/unsigned/"$beta_version"/SHA256SUMS.txt --title "NexusAI Beta $beta_version" --prerelease --notes-file notes.md
